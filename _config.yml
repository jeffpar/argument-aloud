title: Argument Aloud
description: >-
  U.S. Supreme Court Media Archive — Oral argument transcripts, synchronized audio,
  briefs, opinions, advocate records, and justice records spanning every term of the Court.
data_dir: data
remote_theme: pages-themes/minimal@v0.2.0
plugins:
  - jekyll-remote-theme
webrick:
  headers:
    Accept-Ranges: bytes
    Cache-Control: public, max-age=3600
exclude:
  - .github/
  - .history/
  - config.json
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - README.md
  - node_modules/
  - scripts/
  - courts/ussc/cache/
  - courts/ussc/journals/
  - courts/ussc/opinions/pdfs/
  - courts/ussc/transcripts/pdfs/
  - courts/ussc/transcripts/texts/
  - scdb/
include:
  - .well-known
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/default.jpg
google_analytics: G-F4VGXJWVZL
