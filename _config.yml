title: Argument Aloud
data_dir: data
remote_theme: pages-themes/minimal@v0.2.0
plugins:
  - jekyll-remote-theme
webrick:
  headers:
    Accept-Ranges: bytes
    Cache-Control: public, max-age=3600
exclude:
  - .github/
  - .history/
  - config.json
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - README.md
  - node_modules/
  - scripts/
  - courts/ussc/journals/
  - courts/ussc/transcripts/
  - data/ld/
  - data/scdb/
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/default.jpg
