title: Argument Aloud
tagline: Explore U.S. Supreme Court digital media
description: A hub connecting U.S. Supreme Court digital media (briefs, transcripts, recordings, opinions) to cases and collecting stats on the Justices and Advocates who argue them.
url: https://argumentaloud.org
data_dir: data
remote_theme: pages-themes/minimal@v0.2.0
plugins:
  - jekyll-remote-theme
webrick:
  headers:
    Accept-Ranges: bytes
    Cache-Control: public, max-age=3600
exclude:
  - .github/
  - .history/
  - .playwright-profile
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - config.json
  - package.json
  - package-lock.json
  - "*.sh"
  - node_modules/
  - courts/ussc/cache/
  - courts/ussc/indexes/
  - courts/ussc/journals/
  - courts/ussc/minutes/
  - courts/ussc/opinions/
  - "courts/ussc/people/advocates/featured/*/cases-oyez.html"
  - courts/ussc/transcripts/pdfs/
  - courts/ussc/transcripts/text/
  - data/misc/
  - scdb/cache/
  - scdb/current/
  - scripts/
  - tests/
include:
  - .well-known
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/aa_exterior1.jpg
google_analytics: G-F4VGXJWVZL
indexes_base_url: https://index.argumentaloud.org
opinions_base_url: https://xml.argumentaloud.org
