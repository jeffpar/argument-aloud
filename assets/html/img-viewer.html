<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Image</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1a1c22; overflow: hidden; }
  /* All pinch/pan/scroll gestures are handled ourselves below — this stops
     the browser from also applying its own native page pinch-zoom or
     scroll on top of (or instead of) our own. */
  body { touch-action: none; }
  #stage { position: absolute; inset: 0; overflow: hidden; cursor: default; }
  #stage.pannable { cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  #img {
    position: absolute;
    display: block;
    transform-origin: 0 0;
    user-select: none;
    -webkit-user-drag: none;
  }
  #toolbar {
    position: fixed; bottom: 8px; left: 8px;
    display: flex; gap: 4px;
    z-index: 10;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .zoom-btn {
    width: 30px; height: 30px;
    border: none; border-radius: 4px;
    background: rgba(20,20,20,0.6); color: #fff;
    font-size: 17px; line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .zoom-btn:hover { background: rgba(20,20,20,0.8); }
  #zoom-pct {
    min-width: 46px; padding: 0 6px;
    background: rgba(20,20,20,0.6); color: #fff;
    border: none; border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
  }
  #zoom-pct:hover { background: rgba(20,20,20,0.8); }
  #nav-toolbar {
    position: fixed; bottom: 8px; right: 8px;
    display: flex; gap: 4px;
    z-index: 10;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #nav-toolbar[hidden] { display: none; }
  #nav-count {
    min-width: 46px; padding: 0 6px;
    background: rgba(20,20,20,0.6); color: #fff;
    border-radius: 4px;
    font-size: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .zoom-btn:disabled { opacity: 0.35; cursor: default; }
  .zoom-btn:disabled:hover { background: rgba(20,20,20,0.6); }
  html[data-theme="light"] body { background: #fff; }
  @media (prefers-color-scheme: light) { html:not([data-theme]) body { background: #fff; } }
</style>
</head>
<body>
<div id="stage">
  <img id="img" alt="" draggable="false">
</div>
<div id="nav-toolbar" hidden>
  <button class="zoom-btn" id="nav-prev" title="Previous page (←)" aria-label="Previous page">&lsaquo;</button>
  <span id="nav-count"></span>
  <button class="zoom-btn" id="nav-next" title="Next page (→)" aria-label="Next page">&rsaquo;</button>
</div>
<div id="toolbar">
  <button class="zoom-btn" id="zoom-out" title="Zoom out" aria-label="Zoom out">&minus;</button>
  <button id="zoom-pct" title="Toggle full width / full height" aria-label="Toggle full width / full height">100%</button>
  <button class="zoom-btn" id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
</div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var src = params.get('src');
  // Multi-image mode: ?gallery=<sessionStorage key>[&index=N] — lets a
  // caller (see showDocViewer's _stashImageGallery in explorer.js) page
  // through a sequence of images (e.g. every Minutes page image for one
  // date) without reopening the viewer. The array itself travels via
  // sessionStorage (shared with this same-origin iframe), not the URL —
  // a few dozen full image URLs can trivially exceed a request-URI length
  // limit. Falls back to single-image ?src= when absent.
  var galleryKey = params.get('gallery');
  var images = [];
  if (galleryKey) {
    try {
      var parsed = JSON.parse(sessionStorage.getItem(galleryKey) || 'null');
      if (Array.isArray(parsed)) images = parsed.filter(function (s) { return typeof s === 'string' && s; });
    } catch (e) { /* malformed/unavailable — falls back to src below */ }
  }
  if (!images.length && src) images = [src];
  var index = Math.max(0, Math.min(images.length - 1, parseInt(params.get('index'), 10) || 0));

  var img = document.getElementById('img');
  var stage = document.getElementById('stage');
  var zoomPct = document.getElementById('zoom-pct');
  var navToolbar = document.getElementById('nav-toolbar');
  var navPrev = document.getElementById('nav-prev');
  var navNext = document.getElementById('nav-next');
  var navCount = document.getElementById('nav-count');

  function showImage(i) {
    index = Math.max(0, Math.min(images.length - 1, i));
    img.src = images[index];
    navCount.textContent = (index + 1) + ' / ' + images.length;
    navPrev.disabled = index === 0;
    navNext.disabled = index === images.length - 1;
    // A fresh page starts back at "fit" rather than carrying over whatever
    // zoom/pan the previous page was left at — except when the visitor was
    // zoomed all the way out (stickyMinZoom, set below), in which case
    // layoutBase re-pins scale to the new page's own floor once it loads,
    // so "fully zoomed out" itself persists across pages even though the
    // exact scale value (each page's floor can differ) doesn't.
    scale = defaultScale; panX = 0; panY = 0;
    // Lets the parent (explorer.js's showDocViewer) relay this gallery's own
    // current page down into the page-viewer iframe, if it opened this
    // gallery — see terms.js's Minutes Pages list, which keeps its own
    // highlighted page in sync with Left/Right navigation here.
    if (images.length > 1) window.parent.postMessage({ type: 'ussc-gallery-index', index: index }, location.origin);
  }

  if (images.length > 1) {
    navToolbar.hidden = false;
    navPrev.addEventListener('click', function () { showImage(index - 1); });
    navNext.addEventListener('click', function () { showImage(index + 1); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft')  showImage(index - 1);
      else if (e.key === 'ArrowRight') showImage(index + 1);
    });
  }

  // baseLeft/baseTop/baseWidth/baseHeight describe the image's own
  // "fit to viewport width, top-anchored" (at scale 1) position and size —
  // computed once the image loads (and again on resize), since #img is
  // absolutely positioned (so its own transform-origin can anchor zoom at
  // an arbitrary point) rather than laid out via flexbox.
  var baseLeft = 0, baseTop = 0, baseWidth = 0, baseHeight = 0;
  // defaultScale (always 1, "fit width") is where every page starts and what
  // double-click/Reset return to; minScale is the actual zoom-out floor,
  // recomputed per page in layoutBase below — it drops under defaultScale
  // for a page taller than the viewport, so zooming out can trade width for
  // seeing the whole page height at once instead of being stuck cropped.
  var scale = 1, defaultScale = 1, minScale = 1, maxScale = 8;
  var panX = 0, panY = 0; // screen-pixel offset applied on top of the base fit, at the current scale
  // True whenever the visitor's own most recent zoom action left them
  // exactly at the current page's floor — kept in sync at the bottom of
  // every place that changes scale (zoomTo, pinch, Reset). layoutBase
  // reapplies it as the *new* page's own floor (which can differ page to
  // page) every time a fresh page loads, so "zoomed all the way out" itself
  // sticks across Left/Right navigation even though the exact scale doesn't.
  var stickyMinZoom = false;

  // showImage's own scale/panX/panY reset needs those to already exist, so
  // the very first image is shown only once they're declared above.
  if (images.length) showImage(index);

  // Below defaultScale the image no longer fills the viewport's width, so
  // center it horizontally (blank space on both sides) rather than leaving
  // it hugging the left edge — still top-anchored, though (see layoutBase's
  // own doc comment on why); used by every place that snaps back to a
  // fit-or-wider view: layoutBase itself, zoomTo, and pinch-zoom.
  function centeredPanX(atScale) {
    return (window.innerWidth - baseWidth * atScale) / 2;
  }

  // Fits to the viewport's full width (rather than shrinking to also fit the
  // whole image within the viewport's height) and anchors the top edge —
  // these are scanned document pages, and the top is what a reader wants to
  // land on by default. #stage's own overflow:hidden simply crops whatever
  // of a taller-than-viewport page runs past the bottom at defaultScale;
  // zooming out further (down to minScale, recomputed below) trades that
  // full width for seeing more/all of the page's height at once instead.
  function layoutBase() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var iw = img.naturalWidth || vw, ih = img.naturalHeight || vh;
    var fit = vw / iw;
    baseWidth = iw * fit;
    baseHeight = ih * fit;
    baseLeft = 0;
    baseTop = 0;
    img.style.width = baseWidth + 'px';
    img.style.height = baseHeight + 'px';
    img.style.left = baseLeft + 'px';
    img.style.top = baseTop + 'px';
    // A page taller than the viewport can zoom out past "fit width" down to
    // "fit the whole page height too" — floored so an extremely tall scan
    // doesn't shrink to illegibility.
    minScale = baseHeight > vh ? Math.max(0.2, vh / baseHeight) : defaultScale;
    if (stickyMinZoom) scale = minScale;
    else if (scale < minScale) scale = minScale;
    // Re-center (a fresh page, or the viewport/image dimensions changing on
    // resize) whenever not zoomed in past the default fit.
    if (scale <= defaultScale) { panX = centeredPanX(scale); panY = 0; }
    render();
  }

  function render() {
    img.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + scale + ')';
    zoomPct.textContent = Math.round(scale * 100) + '%';
    // Grab cursor whenever there's anything to drag to — either zoomed in
    // past the default fit, or (now that layoutBase fits to width rather
    // than the whole page) a page tall enough that fitting the width alone
    // already runs its bottom past the viewport at the current scale.
    stage.classList.toggle('pannable', scale > defaultScale || baseHeight * scale > window.innerHeight);
  }

  // Changes scale while keeping the point at (screenX, screenY) visually
  // fixed — used by both the +/- buttons (anchored at the stage's own
  // center) and wheel/pinch zoom (anchored at the cursor/pinch midpoint).
  function zoomTo(newScale, screenX, screenY) {
    newScale = Math.max(minScale, Math.min(maxScale, newScale));
    var localX = (screenX - baseLeft - panX) / scale;
    var localY = (screenY - baseTop - panY) / scale;
    scale = newScale;
    if (scale <= defaultScale) {
      panX = centeredPanX(scale); panY = 0; // snap back to the centered, top-anchored view at/below the default "fit width"
    } else {
      panX = screenX - baseLeft - localX * scale;
      panY = screenY - baseTop - localY * scale;
    }
    stickyMinZoom = (scale === minScale);
    render();
  }

  function stageCenter() {
    return { x: window.innerWidth / 2, y: window.innerHeight / 2 };
  }

  img.addEventListener('load', layoutBase);
  window.addEventListener('resize', layoutBase);

  document.getElementById('zoom-in').addEventListener('click', function () {
    var c = stageCenter();
    zoomTo(scale * 1.4, c.x, c.y);
  });
  document.getElementById('zoom-out').addEventListener('click', function () {
    var c = stageCenter();
    zoomTo(scale / 1.4, c.x, c.y);
  });
  // Toggles between the two "fit" anchors: defaultScale (100%, full width)
  // and minScale (this page's own zoomed-all-the-way-out floor, "full
  // height" for a page taller than the viewport). Anything else (zoomed in,
  // or an in-between level from wheel/pinch) counts as "not at the floor"
  // and goes to the floor first, same as clicking it twice from 100% would.
  zoomPct.addEventListener('click', function () {
    var target = scale === minScale ? defaultScale : minScale;
    var c = stageCenter();
    zoomTo(target, c.x, c.y);
  });

  // Wheel = zoom (there's nothing else on this page to scroll), anchored at
  // the cursor so the point under it stays put — matches trackpad pinch,
  // which Chrome/Firefox report as wheel events with ctrlKey set.
  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    zoomTo(scale * Math.pow(1.0025, -e.deltaY), e.clientX, e.clientY);
  }, { passive: false });

  // Scoped to #stage (not document) so a double-click on a toolbar button —
  // #toolbar/#nav-toolbar are siblings of #stage, not descendants, so this
  // excludes them entirely — doesn't also fire this "toggle zoom" gesture on
  // top of the two ordinary clicks the button itself already handled.
  stage.addEventListener('dblclick', function (e) {
    if (scale > defaultScale) { zoomTo(defaultScale, e.clientX, e.clientY); }
    else { zoomTo(2, e.clientX, e.clientY); }
  });

  // Single-finger / mouse drag-to-pan (only meaningful once zoomed in —
  // harmless no-op at the fit scale, since the image exactly fills its
  // space either way) and two-finger pinch-to-zoom-and-pan together.
  var dragging = false, dragX = 0, dragY = 0;
  var pinchStartDist = 0, pinchStartScale = 1, pinchAnchorLocalX = 0, pinchAnchorLocalY = 0;

  function dist(t0, t1) { return Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY); }
  function mid(t0, t1) { return { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 }; }

  stage.addEventListener('mousedown', function (e) {
    dragging = true; dragX = e.clientX; dragY = e.clientY;
    stage.classList.add('dragging');
  });
  window.addEventListener('mousemove', function (e) {
    if (!dragging) return;
    panX += e.clientX - dragX; panY += e.clientY - dragY;
    dragX = e.clientX; dragY = e.clientY;
    render();
  });
  window.addEventListener('mouseup', function () {
    dragging = false;
    stage.classList.remove('dragging');
  });

  stage.addEventListener('touchstart', function (e) {
    if (e.touches.length === 2) {
      pinchStartDist = dist(e.touches[0], e.touches[1]);
      pinchStartScale = scale;
      var m = mid(e.touches[0], e.touches[1]);
      pinchAnchorLocalX = (m.x - baseLeft - panX) / scale;
      pinchAnchorLocalY = (m.y - baseTop - panY) / scale;
    } else if (e.touches.length === 1) {
      dragging = true; dragX = e.touches[0].clientX; dragY = e.touches[0].clientY;
    }
  }, { passive: true });

  stage.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (e.touches.length === 2) {
      var d = dist(e.touches[0], e.touches[1]);
      var m = mid(e.touches[0], e.touches[1]);
      var newScale = Math.max(minScale, Math.min(maxScale, pinchStartScale * (d / pinchStartDist)));
      scale = newScale;
      if (scale <= defaultScale) { panX = centeredPanX(scale); panY = 0; }
      else {
        panX = m.x - baseLeft - pinchAnchorLocalX * scale;
        panY = m.y - baseTop - pinchAnchorLocalY * scale;
      }
      stickyMinZoom = (scale === minScale);
      render();
    } else if (e.touches.length === 1 && dragging) {
      var t = e.touches[0];
      panX += t.clientX - dragX; panY += t.clientY - dragY;
      dragX = t.clientX; dragY = t.clientY;
      render();
    }
  }, { passive: false });

  stage.addEventListener('touchend', function (e) {
    dragging = e.touches.length === 1;
    if (e.touches.length === 1) { dragX = e.touches[0].clientX; dragY = e.touches[0].clientY; }
  });
})();
</script>
</body>
</html>
