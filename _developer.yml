title: Argument Aloud
tagline: An Online Hub for U.S. Supreme Court media
description: Collection of all electronically available briefs, transcripts, journals, opinions, and other case-related media for the U.S. Supreme Court
data_dir: data
remote_theme: pages-themes/minimal@v0.2.0
plugins:
  - jekyll-remote-theme
webrick:
  headers:
    Accept-Ranges: bytes
    Cache-Control: no-cache, no-store, must-revalidate
exclude:
  - .github/
  - .history/
  - .playwright-profile
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - config.json
  - package.json
  - package-lock.json
  - "*.sh"
  - node_modules/
  - courts/ussc/cache/
  - courts/ussc/journals/
  - courts/ussc/opinions/html/
  - courts/ussc/opinions/pdfs/
  - courts/ussc/opinions/text/
  - courts/ussc/transcripts/pdfs/
  - courts/ussc/transcripts/text/
  - data/misc/
  - scdb/
  - scripts/
  - tests/
include:
  - .well-known
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/aa_exterior1.jpg
indexes_base_url: http://localhost:4008
opinions_base_url: http://localhost:4008
