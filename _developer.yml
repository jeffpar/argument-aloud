title: Argument Aloud
tagline: Explore U.S. Supreme Court digital media
description: A hub connecting U.S. Supreme Court digital media (briefs, transcripts, recordings, opinions) to cases and collecting stats on the Justices and Advocates who argue them.
data_dir: data
remote_theme: pages-themes/minimal@v0.2.0
plugins:
  - jekyll-remote-theme
webrick:
  headers:
    Accept-Ranges: bytes
    Cache-Control: no-cache, no-store, must-revalidate
exclude:
  - .github/
  - .history/
  - .playwright-profile
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - config.json
  - package.json
  - package-lock.json
  - "*.sh"
  - node_modules/
  - courts/ussc/briefs/pdfs/
  - courts/ussc/briefs/uw/orig/
  - courts/ussc/cache/
  - courts/ussc/indexes/
  - courts/ussc/journals/
  - courts/ussc/minutes/
  - courts/ussc/opinions/
  - "courts/ussc/people/advocates/featured/*/cases-oyez.html"
  - courts/ussc/people/justices/all/harry_blackmun/_private/
  - courts/ussc/transcripts/pdfs/
  - courts/ussc/transcripts/text/
  - courts/wasc/indexes/
  - courts/wasc/people/
  - courts/wasc/terms/
  - data/misc/
  - scripts/
  - sources/scdb/cache/
  - sources/scdb/current/
  - sources/scdb/justices/
include:
  - .well-known
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/aa_exterior1.jpg
indexes_base_url: http://localhost:4011
opinions_base_url: http://localhost:4012
wasc_base_url: http://localhost:4013
