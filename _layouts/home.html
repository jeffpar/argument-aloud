<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  {%- include head/default.html style="argument" %}
  <style>
    @media (prefers-color-scheme: dark) {
      h1, h2, h3, h4, h5, h6 { color: #d0d3dc; border-color: #2d2f38; }
      a             { color: #5eaee0; }
      a:hover       { color: #7bc8f0; }
      .wrapper      { color: #d0d3dc; }
    }
    html[data-theme="dark"] h1,
    html[data-theme="dark"] h2,
    html[data-theme="dark"] h3,
    html[data-theme="dark"] h4,
    html[data-theme="dark"] h5,
    html[data-theme="dark"] h6  { color: #d0d3dc; border-color: #2d2f38; }
    html[data-theme="dark"] a   { color: #5eaee0; }
    html[data-theme="dark"] a:hover { color: #7bc8f0; }
    html[data-theme="dark"] .wrapper { color: #d0d3dc; }
    html[data-theme="light"] h1,
    html[data-theme="light"] h2,
    html[data-theme="light"] h3,
    html[data-theme="light"] h4,
    html[data-theme="light"] h5,
    html[data-theme="light"] h6  { color: #222; border-color: #e8e8e8; }
    html[data-theme="light"] a   { color: #2672b4; }
    html[data-theme="light"] a:hover { color: #1a5090; }
    html[data-theme="light"] .wrapper { color: #333; }
  </style>
  <body style="overflow: auto;">
    {%- include topbar.html %}
    <div class="wrapper" style="padding: 20px 30px;">
      {{ content }}
    </div>
    <script src="{{ '/assets/js/topbar.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
  </body>
</html>
