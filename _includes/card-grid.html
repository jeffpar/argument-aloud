<div class="card-grid">
  {%- for card in include.cards %}
  <a class="card" href="{{ card.href }}">
    {%- if card.badge %}<span class="card-badge">{{ card.badge }}</span>{% endif %}
    <h2 class="card-title">{{ card.title }}</h2>
    <p class="card-desc">{{ card.desc }}</p>
  </a>
  {%- endfor %}
</div>
